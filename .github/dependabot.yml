# Weekly dependency updates. Minor and patch bumps come as one grouped PR per ecosystem so CI checks them together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # The Android app. Grouped like npm; Gradle is not part of the pre-push hook, so CI's android.yml is what checks these PRs.
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
